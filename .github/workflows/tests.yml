name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v
        env:
          # Fake values so config.py / dashboard_server.py don't crash on import.
          # Tests don't actually call Discord / Twitch APIs.
          DISCORD_TOKEN: test-discord-token
          TWITCH_CLIENT_ID: test-twitch-client
          TWITCH_CLIENT_SECRET: test-twitch-secret
          EVENTSUB_SECRET: test-eventsub-secret
          DISCORD_CLIENT_ID: test-discord-client
          DISCORD_CLIENT_SECRET: test-discord-clientsecret
          DISCORD_REDIRECT_URI: http://localhost:8080/auth/callback
