name: Deploy to Fly.io

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test:
    name: pytest (gate deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: pytest tests/ -v
        env:
          DISCORD_TOKEN: test-discord-token
          TWITCH_CLIENT_ID: test-twitch-client
          TWITCH_CLIENT_SECRET: test-twitch-secret
          EVENTSUB_SECRET: test-eventsub-secret
          DISCORD_CLIENT_ID: test-discord-client
          DISCORD_CLIENT_SECRET: test-discord-clientsecret
          DISCORD_REDIRECT_URI: http://localhost:8080/auth/callback
      - name: Test and build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test  # Tests must pass before deploy runs

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_wait_seconds: 600
          command: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
